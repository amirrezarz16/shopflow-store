
name: ShopFlow Backend CI

on:
  push:
  pull_request:

jobs:
  django-tests:
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: "ci-only-test-key-not-for-production"
      DJANGO_DEBUG: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Check Django configuration
        run: python backend/src/manage.py check

      - name: Run Django tests
        run: python backend/src/manage.py test products --verbosity 2
